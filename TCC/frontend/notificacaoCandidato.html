<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIEP</title>

    <link rel="stylesheet" href="Styles/notificacaoCandidato.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="icon" href="img/favicon.ico">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
</head>

<body>

    <!-- ==================== MENU LATERAL ==================== -->

    <nav class="div_menu_lateral">

        <img src="img/logo.png" class="logo-quadrada">

        <a href="cursos.html" class="btn_item_navegacao">
            <i class="fas fa-home"></i> Cursos
        </a>

        <a href="#" class="btn_item_navegacao">
            <i class="fas fa-search" id="entrar_vagas"></i> Vagas
        </a>

        <a href="minhaCandidaturas.html" class="btn_item_navegacao">
            <i class="fas fa-file-alt"></i> Minhas Candidaturas
        </a>

        <a href="entrevistaCandidato.html" class="btn_item_navegacao">
            <i class="fas fa-calendar-alt"></i> Entrevistas
        </a>

        <a href="perfil.html" class="btn_item_navegacao">
            <i class="fas fa-user"></i> Meu Perfil
        </a>

        <!-- NOTIFICAÇÕES -->
        <a href="notificacaoCandidato.html" class="btn_item_navegacao ativo">

            <i class="fas fa-bell"></i>

            Notificações

            <!-- CONTADOR DE NÃO LIDAS -->
            <span id="contadorNotificacoes" class="contador_notificacoes" style="display: none;">
                0
            </span>

        </a>

        <div class="div_espacador_sair">

            <a href="#" class="btn_item_navegacao" id="voltar_inicio">

                <i class="fas fa-sign-out-alt"></i> Sair

            </a>

        </div>

    </nav>


    <!-- ==================== CONTEÚDO ==================== -->

    <main class="conteudo_notificacoes">

        <div class="cabecalho_notificacoes">

            <h1>Notificações</h1>

            <div class="acoes_notificacoes">

                <button
                    type="button"
                    id="marcarTodasLidas"
                    class="btn_marcar_todas">

                    <i class="fas fa-check-double"></i>

                    Marcar todas como lidas

                </button>

                <button
                    type="button"
                    id="excluirTodas"
                    class="btn_excluir_todas">

                    <i class="fas fa-trash"></i>

                    Excluir todas

                </button>

            </div>

        </div>


        <!-- LISTA DE NOTIFICAÇÕES -->

        <div id="listaNotificacoes" class="lista_notificacoes">

            <!--
                As notificações serão carregadas
                automaticamente pelo JavaScript.
            -->

            <div id="carregandoNotificacoes" class="mensagem_notificacoes">

                <i class="fas fa-spinner fa-spin"></i>

                Carregando notificações...

            </div>

        </div>

    </main>


<script>

    // =========================================================
    // CONFIGURAÇÕES
    // =========================================================

    const API_URL = "http://localhost:3000";


    // =========================================================
    // ELEMENTOS DA PÁGINA
    // =========================================================

    const listaNotificacoes =
        document.getElementById("listaNotificacoes");

    const contadorNotificacoes =
        document.getElementById("contadorNotificacoes");

    const marcarTodasLidas =
        document.getElementById("marcarTodasLidas");

    const excluirTodas =
        document.getElementById("excluirTodas");


    // =========================================================
    // VERIFICAR LOGIN
    // =========================================================

    const token = localStorage.getItem("token");

    const idUsuario = localStorage.getItem("id_usuario");


    if (!token || !idUsuario) {

        alert("Faça login para acessar suas notificações.");

        window.location.href = "loginCandidato.html";

    }


    // =========================================================
    // BUSCAR NOTIFICAÇÕES
    // =========================================================

    async function carregarNotificacoes() {

        try {

            const resposta = await fetch(
                `${API_URL}/notificacoes`,
                {
                    method: "GET",

                    headers: {

                        "Authorization": `Bearer ${token}`,

                        "Content-Type": "application/json"

                    }
                }
            );


            // Token inválido ou expirado
            if (resposta.status === 401) {

                localStorage.removeItem("token");
                localStorage.removeItem("id_usuario");

                alert("Sua sessão expirou. Faça login novamente.");

                window.location.href = "loginCandidato.html";

                return;

            }


            const dados = await resposta.json();


            if (!resposta.ok) {

                throw new Error(
                    dados.erro || "Erro ao carregar notificações"
                );

            }


            // Atualiza contador
            atualizarContador(dados.naoLidas);


            // Exibe notificações
            mostrarNotificacoes(dados.notificacoes);


        } catch (erro) {

            console.error(
                "Erro ao carregar notificações:",
                erro
            );


            listaNotificacoes.innerHTML = `

                <div class="mensagem_notificacoes">

                    <i class="fas fa-exclamation-circle"></i>

                    Não foi possível carregar as notificações.

                </div>

            `;

        }

    }


    // =========================================================
    // ATUALIZAR CONTADOR
    // =========================================================

    function atualizarContador(quantidade) {

        quantidade = Number(quantidade) || 0;


        contadorNotificacoes.textContent = quantidade;


        if (quantidade > 0) {

            contadorNotificacoes.style.display = "inline-flex";

        } else {

            contadorNotificacoes.style.display = "none";

        }

    }


    // =========================================================
    // MOSTRAR NOTIFICAÇÕES
    // =========================================================

    function mostrarNotificacoes(notificacoes) {

        listaNotificacoes.innerHTML = "";


        // Nenhuma notificação
        if (!notificacoes || notificacoes.length === 0) {

            listaNotificacoes.innerHTML = `

                <div class="mensagem_notificacoes">

                    <i class="far fa-bell-slash"></i>

                    Você não possui notificações.

                </div>

            `;

            return;

        }


        notificacoes.forEach(notificacao => {

            const div = document.createElement("div");


            // Classe diferente para lida/não lida
            div.className = "notificacao_item";


            if (Number(notificacao.lida) === 0) {

                div.classList.add("nao_lida");

            } else {

                div.classList.add("lida");

            }


            // Formatar data
            const dataFormatada =
                formatarData(notificacao.data_envio);


            div.innerHTML = `

                <div class="notificacao_conteudo">

                    <div class="notificacao_icone">

                        <i class="fas fa-bell"></i>

                    </div>


                    <div class="notificacao_texto">

                        <div class="notificacao_mensagem">

                            ${escapeHTML(notificacao.mensagem)}

                        </div>


                        <div class="notificacao_data">

                            <i class="far fa-clock"></i>

                            ${dataFormatada}

                        </div>

                    </div>


                    ${
                        Number(notificacao.lida) === 0

                        ?

                        `<span class="indicador_nao_lida"
                               title="Não lida">
                        </span>`

                        :

                        ""

                    }

                </div>


                <button
                    type="button"
                    class="btn_excluir_notificacao"
                    data-id="${notificacao.id_notificacao}"
                    title="Excluir notificação">

                    <i class="fas fa-trash"></i>

                </button>

            `;


            // =================================================
            // CLICAR NA NOTIFICAÇÃO
            // =================================================

            div.addEventListener("click", function(event) {

                // Se clicou no botão excluir,
                // não marca como lida.
                if (
                    event.target.closest(
                        ".btn_excluir_notificacao"
                    )
                ) {

                    return;

                }


                // Só envia para o backend se ainda não estiver lida
                if (Number(notificacao.lida) === 0) {

                    marcarComoLida(
                        notificacao.id_notificacao,
                        div
                    );

                }

            });


            // =================================================
            // BOTÃO EXCLUIR
            // =================================================

            const botaoExcluir =
                div.querySelector(
                    ".btn_excluir_notificacao"
                );


            botaoExcluir.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();


                    excluirNotificacao(
                        notificacao.id_notificacao
                    );

                }
            );


            listaNotificacoes.appendChild(div);

        });

    }


    // =========================================================
    // MARCAR UMA NOTIFICAÇÃO COMO LIDA
    // =========================================================

    async function marcarComoLida(id, elemento) {

        try {

            const resposta = await fetch(

                `${API_URL}/notificacoes/${id}/lida`,

                {

                    method: "PUT",

                    headers: {

                        "Authorization": `Bearer ${token}`,

                        "Content-Type": "application/json"

                    }

                }

            );


            const dados = await resposta.json();


            if (!resposta.ok) {

                throw new Error(
                    dados.erro ||
                    "Erro ao marcar notificação como lida"
                );

            }


            // Altera visualmente
            elemento.classList.remove("nao_lida");

            elemento.classList.add("lida");


            // Remove indicador
            const indicador =
                elemento.querySelector(
                    ".indicador_nao_lida"
                );


            if (indicador) {

                indicador.remove();

            }


            // Atualiza contador
            const quantidadeAtual =
                Number(contadorNotificacoes.textContent) || 0;


            const novaQuantidade =
                Math.max(quantidadeAtual - 1, 0);


            atualizarContador(novaQuantidade);


        } catch (erro) {

            console.error(
                "Erro ao marcar notificação:",
                erro
            );

        }

    }


    // =========================================================
    // MARCAR TODAS COMO LIDAS
    // =========================================================

    marcarTodasLidas.addEventListener(
        "click",
        async function() {

            try {

                const resposta = await fetch(

                    `${API_URL}/notificacoes/lerTodas`,

                    {

                        method: "PUT",

                        headers: {

                            "Authorization":
                                `Bearer ${token}`,

                            "Content-Type":
                                "application/json"

                        }

                    }

                );


                const dados = await resposta.json();


                if (!resposta.ok) {

                    throw new Error(
                        dados.erro ||
                        "Erro ao marcar notificações"
                    );

                }


                // Atualiza visualmente todas
                document
                    .querySelectorAll(
                        ".notificacao_item.nao_lida"
                    )
                    .forEach(notificacao => {

                        notificacao.classList.remove(
                            "nao_lida"
                        );

                        notificacao.classList.add(
                            "lida"
                        );


                        const indicador =
                            notificacao.querySelector(
                                ".indicador_nao_lida"
                            );


                        if (indicador) {

                            indicador.remove();

                        }

                    });


                // Zera contador
                atualizarContador(0);


            } catch (erro) {

                console.error(
                    "Erro ao marcar todas como lidas:",
                    erro
                );

            }

        }
    );


    // =========================================================
    // EXCLUIR UMA NOTIFICAÇÃO
    // =========================================================

    async function excluirNotificacao(id) {

        const confirmar =
            confirm(
                "Deseja excluir esta notificação?"
            );


        if (!confirmar) {

            return;

        }


        try {

            const resposta = await fetch(

                `${API_URL}/notificacoes/${id}`,

                {

                    method: "DELETE",

                    headers: {

                        "Authorization":
                            `Bearer ${token}`,

                        "Content-Type":
                            "application/json"

                    }

                }

            );


            const dados = await resposta.json();


            if (!resposta.ok) {

                throw new Error(
                    dados.erro ||
                    "Erro ao excluir notificação"
                );

            }


            // Recarrega a lista e contador
            carregarNotificacoes();


        } catch (erro) {

            console.error(
                "Erro ao excluir notificação:",
                erro
            );

            alert(
                "Não foi possível excluir a notificação."
            );

        }

    }


    // =========================================================
    // EXCLUIR TODAS AS NOTIFICAÇÕES
    // =========================================================

    excluirTodas.addEventListener(
        "click",
        async function() {

            const confirmar =
                confirm(
                    "Deseja excluir todas as notificações?"
                );


            if (!confirmar) {

                return;

            }


            try {

                const resposta = await fetch(

                    `${API_URL}/notificacoes`,

                    {

                        method: "DELETE",

                        headers: {

                            "Authorization":
                                `Bearer ${token}`,

                            "Content-Type":
                                "application/json"

                        }

                    }

                );


                const dados = await resposta.json();


                if (!resposta.ok) {

                    throw new Error(
                        dados.erro ||
                        "Erro ao excluir notificações"
                    );

                }


                // Limpa a tela
                mostrarNotificacoes([]);


                // Zera contador
                atualizarContador(0);


            } catch (erro) {

                console.error(
                    "Erro ao excluir notificações:",
                    erro
                );

                alert(
                    "Não foi possível excluir as notificações."
                );

            }

        }
    );


    // =========================================================
    // FORMATAR DATA
    // =========================================================

    function formatarData(data) {

        if (!data) {

            return "Data não informada";

        }


        const dataObjeto = new Date(data);


        if (isNaN(dataObjeto.getTime())) {

            return data;

        }


        return dataObjeto.toLocaleString(
            "pt-BR",
            {

                day: "2-digit",

                month: "2-digit",

                year: "numeric",

                hour: "2-digit",

                minute: "2-digit"

            }
        );

    }


    // =========================================================
    // PROTEGER TEXTO DA NOTIFICAÇÃO
    // =========================================================

    function escapeHTML(texto) {

        const div = document.createElement("div");

        div.textContent = texto || "";

        return div.innerHTML;

    }


    // =========================================================
    // VAGAS
    // =========================================================

    document
        .querySelectorAll(".btn_item_navegacao")[1]
        .onclick = () => {

            window.location.href =
                "vagasCandidato.html";

        };


    // =========================================================
    // SAIR
    // =========================================================

    document
        .getElementById("voltar_inicio")
        .onclick = () => {

            localStorage.removeItem("token");

            localStorage.removeItem("id_usuario");

            localStorage.removeItem("id_empresa");

            window.location.href =
                "index.html";

        };


    // =========================================================
    // INICIAR
    // =========================================================

    carregarNotificacoes();

</script>

</body>
</html>
