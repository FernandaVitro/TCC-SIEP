<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrack - Vagas Disponíveis</title>
    <link rel="stylesheet" href="Styles/vagasCandidato.css">
</head>

<body>

    <header class="navbar">
        <div class="nav-content">
            <div class="logo">
                <img src="img/logo.png" class="logo-quadrada">
                <span>SIEP</span>
            </div>
            <div class="nav-actions">
                <a href="#" class="btn-text">Entrar</a>
                <a href="#" class="btn-primary">Criar conta</a>
            </div>
        </div>
    </header>

    <main class="main-container">
        <section class="hero">
            <h1>Vagas Disponíveis</h1>
            <p>Encontre a oportunidade perfeita para você</p>
        </section>

        <section class="filter-section">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Buscar vagas, empresas...">
            </div>
            <div class="select-group">
                <select id="filterType">
                    <option value="all">Todos os tipos</option>
                    <option value="Estágio">Estágio</option>
                    <option value="Jovem Aprendiz">Jovem Aprendiz</option>
                </select>
                <select id="filterModel">
                    <option value="all">Todos</option>
                    <option value="Híbrido">Híbrido</option>
                    <option value="Remoto">Remoto</option>
                    <option value="Presencial">Presencial</option>
                </select>
                <select id="filterArea">
                    <option value="all">Todas</option>
                    <option value="Tecnologia">Tecnologia</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Atendimento">Atendimento</option>
                    <option value="Administrativo">Administrativo</option>
                    <option value="Recursos Humanos">Recursos Humanos</option>
                    <option value="Financeiro">Financeiro</option>
                    <option value="Contabilidade">Contabilidade</option>
                    <option value="Jurídico">Jurídico</option>
                    <option value="Comercial">Comercial</option>
                    <option value="Vendas">Vendas</option>
                    <option value="Logística">Logística</option>
                    <option value="Compras">Compras</option>
                    <option value="Produção">Produção</option>
                    <option value="Engenharia">Engenharia</option>
                    <option value="Arquitetura">Arquitetura</option>
                    <option value="Design">Design</option>
                    <option value="Comunicação">Comunicação</option>
                    <option value="Publicidade">Publicidade</option>
                    <option value="Jornalismo">Jornalismo</option>
                    <option value="Educação">Educação</option>
                    <option value="Saúde">Saúde</option>
                    <option value="Farmácia">Farmácia</option>
                    <option value="Psicologia">Psicologia</option>
                    <option value="Serviço Social">Serviço Social</option>
                    <option value="Agronegócio">Agronegócio</option>
                    <option value="Meio Ambiente">Meio Ambiente</option>
                    <option value="Turismo">Turismo</option>
                    <option value="Hotelaria">Hotelaria</option>
                    <option value="Gastronomia">Gastronomia</option>
                    <option value="Construção Civil">Construção Civil</option>
                    <option value="Segurança do Trabalho">Segurança do Trabalho</option>
                    <option value="Pesquisa e Desenvolvimento">Pesquisa e Desenvolvimento</option>
                    <option value="Qualidade">Qualidade</option>
                    <option value="Estágio">Estágio</option>
                    <option value="Jovem Aprendiz">Jovem Aprendiz</option>
                </select>
            </div>
        </section>

        <div class="job-grid" id="jobGrid">
        </div>
    </main>
    <script>
        // BOTÕES DO TOPO
        document.querySelector(".btn-text").onclick = (e) => {
            e.preventDefault()
            window.location.href = "loginCandidato.html"
        }

        document.querySelector(".btn-primary").onclick = (e) => {
            e.preventDefault()
            window.location.href = "cadastroCandidato.html"
        }

        function irParaLogin() {
            window.location.href = "loginCandidato.html"
        }

        

        // 🔥 AJUSTAR NAVBAR SE ESTIVER LOGADO
        window.addEventListener("DOMContentLoaded", () => {

            const navActions = document.querySelector(".nav-actions")

            if (token && idUsuario) {
                // remove botões antigos
                navActions.innerHTML = ""

                // cria botão voltar
                const btnPerfil = document.createElement("a")
                btnPerfil.href = "perfil.html"
                btnPerfil.className = "btn-primary"
                btnPerfil.innerText = "Voltar ao perfil"

                navActions.appendChild(btnPerfil)
            }
        })

        let jobs = []

        const token = localStorage.getItem("token")
        const idUsuario = localStorage.getItem("id_usuario")

        // ================= BUSCAR VAGAS =================
        async function carregarVagas() {
            try {
                const res = await fetch(`http://localhost:3000/vagas?id_usuario=${idUsuario || 0}`)
                const dados = await res.json()

                jobs = dados.map(v => ({
                    id_vaga: v.id_vaga,
                    title: v.titulo_vaga,
                    company: v.nome_empresa || "Empresa",
                    type: v.tipo,
                    model: v.modalidade,
                    area: v.area,
                    location: `${v.cidade}, ${v.uf}`,
                    salary: v.salario || "A combinar",
                    desc: v.descricao,
                    skills: v.requisitos ? v.requisitos.split(',') : [],
                    ja_candidatado: v.ja_candidatado || false
                }))

                renderJobs({
                    search: '',
                    type: 'all',
                    model: 'all',
                    area: 'all'
                })

            } catch (erro) {
                console.log("Erro ao carregar vagas:", erro)
            }
        }

        // ================= CANDIDATAR =================
        async function candidatar(idVaga) {

            const token = localStorage.getItem("token")

            if (!token) {
                window.location.href = "loginCandidato.html"
                return
            }

            try {
                const res = await fetch("http://localhost:3000/candidatar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}` // 🔥 ESSENCIAL
                    },
                    body: JSON.stringify({
                        id_vaga: idVaga
                    })
                })

                const data = await res.json()

                if (data.mensagem === "Você já se candidatou a esta vaga") {
                    alert("Você já se candidatou a esta vaga")
                } else if (data.mensagem === "Candidatura enviada") {
                    alert("Candidatura enviada com sucesso!")
                    carregarVagas() // 🔥 atualiza a tela
                } else {
                    alert("Erro ao candidatar")
                }

            } catch (erro) {
                console.log(erro)
                alert("Erro no servidor")
            }
        }

        // ================= RENDER =================
        function renderJobs(filterData) {
            const grid = document.getElementById('jobGrid')
            grid.innerHTML = ""

            const filtered = jobs.filter(job => {
                const matchesSearch =
                    job.title.toLowerCase().includes(filterData.search.toLowerCase()) ||
                    job.company.toLowerCase().includes(filterData.search.toLowerCase())

                const matchesType = filterData.type === 'all' || job.type === filterData.type
                const matchesModel = filterData.model === 'all' || job.model === filterData.model
                const matchesArea = filterData.area === 'all' || job.area === filterData.area

                return matchesSearch && matchesType && matchesModel && matchesArea
            })

            filtered.forEach(job => {

                let botao = ""

                // NÃO LOGADO
                if (!idUsuario) {
                    botao = `
        <button class="btn-apply" onclick="irParaLogin()">
            Faça login para candidatar-se
        </button>
    `
                }
                // LOGADO MAS JÁ SE CANDIDATOU
                else if (job.ja_candidatado) {
                    botao = `
        <button class="btn-apply" disabled>
            Você já se candidatou
        </button>
    `
                }
                // LOGADO E PODE CANDIDATAR
                else {
                    botao = `
        <button class="btn-apply" onclick="candidatar(${job.id_vaga})">
            Candidatar-se
        </button>
    `
                }

                grid.innerHTML += `
                <div class="job-card">
                    <div class="card-header">
                        <div class="company-logo">💼</div>
                        <div class="title-info">
                            <h3>${job.title}</h3>
                            <p class="company-name">${job.company}</p>
                        </div>
                    </div>
    
                    <div class="tags">
                        <span class="tag tag-blue">${job.type}</span>
                        <span class="tag tag-purple">${job.model}</span>
                        <span class="tag tag-green">${job.area}</span>
                    </div>
    
                    <div class="job-meta">
                        <span> ${job.location}</span>
                        <span> R$ ${job.salary}</span>
                    </div>
    
                    <p class="job-desc">${job.desc}</p>
    
                    <div class="skills-list">
                        ${job.skills.map(s => `<span class="skill-pill">${s}</span>`).join('')}
                    </div>
    
                    ${botao}
                </div>
                `
            })
        }

        // ================= FILTROS =================
        const inputs = ['searchInput', 'filterType', 'filterModel', 'filterArea']

        inputs.forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                renderJobs({
                    search: document.getElementById('searchInput').value,
                    type: document.getElementById('filterType').value,
                    model: document.getElementById('filterModel').value,
                    area: document.getElementById('filterArea').value
                })
            })
        })

        carregarVagas()
    </script>
</body>


</html>
