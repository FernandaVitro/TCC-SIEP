<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIEP - Minhas Candidaturas</title>

    <link rel="stylesheet" href="Styles/minhaCandidaturas.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="icon" href="img/favicon.ico">

    <link rel="apple-touch-icon"
        href="img/apple-touch-icon.png">

</head>


<body>


    <!-- =========================
         MENU LATERAL
         ========================= -->

    <nav class="div_menu_lateral">

        <img src="img/logo.png" class="logo-quadrada">


        <a href="cursos.html" class="btn_item_navegacao">

            <i class="fas fa-home"></i>

            Cursos

        </a>


        <a href="#" class="btn_item_navegacao">

            <i class="fas fa-search"></i>

            Vagas

        </a>


        <a href="minhaCandidaturas.html"
            class="btn_item_navegacao ativo">

            <i class="fas fa-file-alt"></i>

            Minhas Candidaturas

        </a>


        <a href="entrevistaCandidato.html"
            class="btn_item_navegacao">

            <i class="fas fa-calendar-alt"></i>

            Entrevistas

        </a>


        <a href="perfil.html"
            class="btn_item_navegacao">

            <i class="fas fa-user"></i>

            Meu Perfil

        </a>


        <a href="notificacaoCandidato.html"
            class="btn_item_navegacao">

            <i class="fas fa-bell"></i>

            Notificações

        </a>


        <div class="div_espacador_sair">

            <a href="#"
                class="btn_item_navegacao"
                id="voltar_inicio">

                <i class="fas fa-sign-out-alt"></i>

                Sair

            </a>

        </div>

    </nav>



    <!-- =========================
         CONTEÚDO
         ========================= -->

    <main class="div_conteudo_principal">


        <div class="div_cabecalho">

            <div>

                <h1>

                    Minhas Candidaturas

                </h1>


                <p>

                    Acompanhe as vagas para as quais você se candidatou.

                </p>

            </div>

        </div>



        <!-- LISTA -->

        <div id="listaCandidaturas">

            <div class="carregando">

                <i class="fas fa-spinner fa-spin"></i>

                Carregando candidaturas...

            </div>

        </div>


    </main>



    <script>


        // ==========================================
        // TOKEN E USUÁRIO
        // ==========================================

        const token =
            localStorage.getItem("token");

        const idUsuario =
            localStorage.getItem("id_usuario");


        // ==========================================
        // VERIFICAR LOGIN
        // ==========================================

        if (!token || !idUsuario) {

            window.location.href =
                "loginCandidato.html";

        }


        // ==========================================
        // BOTÃO VAGAS
        // ==========================================

        document.querySelectorAll(
            ".btn_item_navegacao"
        )[1].onclick = () => {

            window.location.href =
                "vagasCandidato.html";

        };


        // ==========================================
        // FORMATAR STATUS
        // ==========================================

        function formatarStatus(status) {

            if (!status) {

                return "Em análise";

            }


            const valor =
                status.toString().toLowerCase();


            if (
                valor === "enviada" ||
                valor === "enviado"
            ) {

                return "Enviada";

            }


            if (
                valor === "analise" ||
                valor === "em análise" ||
                valor === "em analise"
            ) {

                return "Em análise";

            }


            if (
                valor === "aprovada" ||
                valor === "aprovado"
            ) {

                return "Aprovada";

            }


            if (
                valor === "reprovada" ||
                valor === "reprovado"
            ) {

                return "Não selecionado";

            }


            if (
                valor === "entrevista"
            ) {

                return "Entrevista";

            }


            return status;

        }


        // ==========================================
        // CLASSE DO STATUS
        // ==========================================

        function classeStatus(status) {

            const valor =
                status.toString().toLowerCase();


            if (
                valor.includes("aprov")
            ) {

                return "status-aprovada";

            }


            if (
                valor.includes("reprov") ||
                valor.includes("não selecion")
            ) {

                return "status-reprovada";

            }


            if (
                valor.includes("entrevista")
            ) {

                return "status-entrevista";

            }


            return "status-analise";

        }


        // ==========================================
        // FORMATAR SALÁRIO
        // ==========================================

        function formatarSalario(salario) {

            if (
                salario === null ||
                salario === undefined ||
                salario === "" ||
                salario === "0"
            ) {

                return "A combinar";

            }


            const numero =
                Number(salario);


            if (isNaN(numero)) {

                return salario;

            }


            return numero.toLocaleString(
                "pt-BR",
                {
                    style: "currency",
                    currency: "BRL"
                }
            );

        }


        // ==========================================
        // CARREGAR CANDIDATURAS
        // ==========================================

        async function carregarCandidaturas() {

            const lista =
                document.getElementById(
                    "listaCandidaturas"
                );


            try {

                const resposta = await fetch(

                    `http://localhost:3000/candidaturasUsuario/${idUsuario}`,

                    {

                        method: "GET",

                        headers: {

                            "Authorization":
                                `Bearer ${token}`,

                            "Content-Type":
                                "application/json"

                        }

                    }

                );


                // TOKEN INVÁLIDO

                if (
                    resposta.status === 401 ||
                    resposta.status === 403
                ) {

                    localStorage.removeItem("token");

                    window.location.href =
                        "loginCandidato.html";

                    return;

                }


                // ERRO

                if (!resposta.ok) {

                    throw new Error(
                        "Erro ao buscar candidaturas."
                    );

                }


                const candidaturas =
                    await resposta.json();


                // ==========================================
                // NENHUMA CANDIDATURA
                // ==========================================

                if (
                    candidaturas.length === 0
                ) {

                    lista.innerHTML = `

                        <div class="card-vazio">

                            <div class="icone-vazio">

                                <i class="fas fa-file-circle-xmark"></i>

                            </div>


                            <h2>
                                Nenhuma candidatura
                            </h2>


                            <p>
                                Você ainda não se candidatou
                                a nenhuma vaga.
                            </p>

                        </div>

                    `;

                    return;

                }


                // Limpar carregamento

                lista.innerHTML = "";


                // ==========================================
                // CRIAR CARDS
                // ==========================================

                candidaturas.forEach(
                    candidatura => {


                    const status =
                        formatarStatus(
                            candidatura.status
                        );


                    const classe =
                        classeStatus(
                            status
                        );


                    const titulo =
                        candidatura.titulo_vaga ||
                        "Vaga não informada";


                    const empresa =
                        candidatura.nome_empresa ||
                        "Empresa não informada";


                    const area =
                        candidatura.area ||
                        "Não informada";


                    const tipo =
                        candidatura.tipo ||
                        "Não informado";


                    const modalidade =
                        candidatura.modalidade ||
                        "Não informada";


                    const cidade =
                        candidatura.cidade ||
                        "Não informada";


                    const uf =
                        candidatura.uf ||
                        "";


                    const salario =
                        formatarSalario(
                            candidatura.salario
                        );


                    const data =
                        candidatura.data_candidatura ||
                        "Não informada";



                    // CARD

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "card-candidatura";


                    card.innerHTML = `

                        <div class="cabecalho-candidatura">


                            <div class="icone-candidatura">

                                <i class="fas fa-briefcase"></i>

                            </div>


                            <div class="titulo-candidatura">

                                <h2>

                                    ${titulo}

                                </h2>


                                <p>

                                    ${empresa}

                                </p>

                            </div>


                            <span class="
                                status-candidatura
                                ${classe}
                            ">

                                ${status}

                            </span>


                        </div>



                        <div class="informacoes-candidatura">


                            <div class="informacao">

                                <div class="informacao-esquerda">

                                    <i class="fas fa-calendar"></i>

                                    <span>
                                        Candidatura enviada
                                    </span>

                                </div>


                                <strong>

                                    ${data}

                                </strong>

                            </div>



                            <div class="informacao">

                                <div class="informacao-esquerda">

                                    <i class="fas fa-layer-group"></i>

                                    <span>
                                        Área
                                    </span>

                                </div>


                                <strong>

                                    ${area}

                                </strong>

                            </div>



                            <div class="informacao">

                                <div class="informacao-esquerda">

                                    <i class="fas fa-clock"></i>

                                    <span>
                                        Tipo
                                    </span>

                                </div>


                                <strong>

                                    ${tipo}

                                </strong>

                            </div>



                            <div class="informacao">

                                <div class="informacao-esquerda">

                                    <i class="fas fa-building"></i>

                                    <span>
                                        Modalidade
                                    </span>

                                </div>


                                <strong>

                                    ${modalidade}

                                </strong>

                            </div>



                            <div class="informacao">

                                <div class="informacao-esquerda">

                                    <i class="fas fa-location-dot"></i>

                                    <span>
                                        Local
                                    </span>

                                </div>


                                <strong>

                                    ${cidade}
                                    ${uf ? " - " + uf : ""}

                                </strong>

                            </div>



                            <div class="informacao ultima-informacao">

                                <div class="informacao-esquerda">

                                    <i class="fas fa-money-bill-wave"></i>

                                    <span>
                                        Salário
                                    </span>

                                </div>


                                <strong>

                                    ${salario}

                                </strong>

                            </div>


                        </div>

                    `;


                    lista.appendChild(card);


                });


            } catch (erro) {

                console.error(
                    "Erro ao carregar candidaturas:",
                    erro
                );


                lista.innerHTML = `

                    <div class="card-erro">

                        <div class="icone-erro">

                            <i class="fas fa-exclamation-triangle"></i>

                        </div>


                        <h2>
                            Erro ao carregar candidaturas
                        </h2>


                        <p>
                            Não foi possível carregar
                            suas candidaturas.
                        </p>

                    </div>

                `;

            }

        }


        // ==========================================
        // INICIAR
        // ==========================================

        carregarCandidaturas();



        // ==========================================
        // SAIR
        // ==========================================

        document.getElementById(
            "voltar_inicio"
        ).onclick = () => {

            localStorage.removeItem("token");

            localStorage.removeItem("id_usuario");

            localStorage.removeItem("id_empresa");

            window.location.href =
                "index.html";

        };

    </script>

</body>

</html>
