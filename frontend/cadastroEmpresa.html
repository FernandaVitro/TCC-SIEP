<script>
    window.addEventListener("load", () => {

        document.getElementById("nome_empresa").value = "";
        document.getElementById("cnpj").value = "";
        document.getElementById("email").value = "";
        document.getElementById("telefone").value = "";
        document.getElementById("endereco").value = "";
        document.getElementById("cidade").value = "";
        document.getElementById("descricao").value = "";
        document.getElementById("senha").value = "";
        document.getElementById("confirmar_senha").value = "";
        document.getElementById("PIN").value = "";

        document.getElementById("setor_atuacao").selectedIndex = 0;
        document.getElementById("uf").selectedIndex = 0;

    });

    document.getElementById("voltar_inicio").onclick = () => {
        window.location.href = 'index.html';
    };

    document.getElementById("login_empresa").onclick = () => {
        window.location.href = 'loginEmpresa.html';
    };

    document.getElementById("login_empresa2").onclick = () => {
        window.location.href = 'loginEmpresa.html';
    };

    function irParaEtapa2() {
        document.getElementById('etapa_1').classList.add('oculto');
        document.getElementById('etapa_2').classList.remove('oculto');

        document.getElementById('etapa2_indicador').classList.add('ativa');
        document.getElementById('linha_etapa').classList.add('ativa');
    }

    function voltarEtapa1() {
        document.getElementById('etapa_2').classList.add('oculto');
        document.getElementById('etapa_1').classList.remove('oculto');

        document.getElementById('etapa2_indicador').classList.remove('ativa');
        document.getElementById('linha_etapa').classList.remove('ativa');
    }

    // Banco de dados
    document.getElementById("btn_cadastrar").addEventListener("click", async () => {

        const senha = document.getElementById("senha").value;
        const confirmar = document.getElementById("confirmar_senha").value;

        if (senha !== confirmar) {
            document.getElementById("resultado").innerText = "As senhas não coincidem";
            return;
        }

        const dados = {
            nome_empresa: document.getElementById("nome_empresa").value,
            cnpj: document.getElementById("cnpj").value.replace(/\D/g, ""),
            email: document.getElementById("email").value,
            telefone: document.getElementById("telefone").value,
            setor_atuacao: document.getElementById("setor_atuacao").value,
            endereco: document.getElementById("endereco").value,
            cidade: document.getElementById("cidade").value,
            uf: document.getElementById("uf").value,
            descricao: document.getElementById("descricao").value,
            PIN: document.getElementById("PIN").value,
            senha: senha
        };

        try {
            const resposta = await fetch("http://localhost:3000/cadastroEmpresa", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dados)
            });

            const retorno = await resposta.json();
            document.getElementById("resultado").innerText = retorno.resposta;

            if (retorno.resposta.includes("sucesso")) {
                setTimeout(() => {
                    window.location.href = "loginEmpresa.html";
                }, 1500);
            }

        } catch (erro) {
            document.getElementById("resultado").innerText = "Erro ao conectar com o servidor";
            console.error(erro);
        }
    });

    document.getElementById("cnpj").addEventListener("input", function () {
        let valor = this.value.replace(/\D/g, "").slice(0, 14);

        valor = valor.replace(/^(\d{2})(\d)/, "$1.$2");
        valor = valor.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
        valor = valor.replace(/\.(\d{3})(\d)/, ".$1/$2");
        valor = valor.replace(/(\d{4})(\d)/, "$1-$2");

        this.value = valor;
    });

    document.getElementById("telefone").addEventListener("input", function () {
        let valor = this.value.replace(/\D/g, "").slice(0, 11);

        if (valor.length <= 10) {
            valor = valor.replace(/^(\d{2})(\d)/, "($1) $2");
            valor = valor.replace(/(\d{4})(\d)/, "$1-$2");
        } else {
            valor = valor.replace(/^(\d{2})(\d)/, "($1) $2");
            valor = valor.replace(/(\d{5})(\d)/, "$1-$2");
        }

        this.value = valor;
    });

    // Máscara CPF
    document.getElementById("cpf").addEventListener("input", function () {
        let valor = this.value.replace(/\D/g, "").slice(0, 11);

        valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
        valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
        valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

        this.value = valor;
    });

</script>
