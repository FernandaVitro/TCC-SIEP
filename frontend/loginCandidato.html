<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIEP</title>

    <link rel="stylesheet" href="Styles/loginCandidato.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="icon" href="img/favicon.ico">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
</head>

<body>

    <!-- RECUPERAR SENHA -->
    <div id="boxRecuperar" style="display: none;">
        <div class="recuperar-card">

            <h3>Recuperar senha</h3>
            <p class="recuperar-sub">Digite seus dados</p>

            <div class="input-group">
                <label for="cpfRecuperar">CPF</label>
                <input type="text" id="cpfRecuperar" placeholder="CPF"
                    maxlength="14" autocomplete="off">
            </div>

            <div class="input-group active">
                <label for="novaSenhaRecuperar">Nova senha</label>
                <input type="password" id="novaSenhaRecuperar"
                    placeholder="Nova senha" autocomplete="new-password">
            </div>

            <div class="input-group">
                <label for="respostaSeguranca">PIN de segurança</label>
                <input type="password" id="respostaSeguranca"
                    placeholder="Digite o CPF primeiro" disabled autocomplete="off">
            </div>

            <button type="button" id="btnRecuperar">Atualizar senha</button>
            <button type="button" class="btn-cancelar" onclick="fecharRecuperar()">Cancelar</button>

        </div>
    </div>

    <main class="page">

        <a href="#" class="back" id="btn_voltar_inicio">
            ← Voltar para início
        </a>

        <div class="card">

            <img src="img/logo.png" class="logo-quadrada" alt="Logo do SIEP">

            <h1>Bem-vindo de volta!</h1>

            <p class="subtitle">
                Entre com sua conta de candidato
            </p>

            <form id="form_login">

                <label for="input_cpf">CPF</label>
                <div class="input-group">
                    <input type="text" id="input_cpf" maxlength="14" autocomplete="off">
                </div>

                <label for="input_senha">Senha</label>
                <div class="input-group">
                    <input type="password" id="input_senha" autocomplete="new-password">
                </div>

                <button type="submit">Entrar</button>

                <p style="margin-top:10px;">
                    <a href="#" id="btnEsqueciSenha">Esqueci minha senha</a>
                </p>

            </form>

            <p id="msg_resultado"></p>

            <p class="register">
                Não tem uma conta?
                <a href="#" id="btn_ir_cadastro">Faça seu cadastro</a>
            </p>

        </div>

    </main>

    <script>
        // ELEMENTOS
        const boxRecuperar = document.getElementById("boxRecuperar");
        const campoCPFRecuperar = document.getElementById("cpfRecuperar");
        const campoNovaSenha = document.getElementById("novaSenhaRecuperar");
        const campoPIN = document.getElementById("respostaSeguranca");
        const botaoRecuperar = document.getElementById("btnRecuperar");
        const msgResultado = document.getElementById("msg_resultado");

        // MÁSCARA CPF
        function aplicarMascaraCPF(input) {
            input.addEventListener("input", () => {
                let valor = input.value.replace(/\D/g, "");

                if (valor.length > 11) {
                    valor = valor.substring(0, 11);
                }

                if (valor.length > 9) {
                    valor = valor.replace(
                        /^(\d{3})(\d{3})(\d{3})(\d{1,2}).*/,
                        "$1.$2.$3-$4"
                    );
                } else if (valor.length > 6) {
                    valor = valor.replace(
                        /^(\d{3})(\d{3})(\d{1,3}).*/,
                        "$1.$2.$3"
                    );
                } else if (valor.length > 3) {
                    valor = valor.replace(
                        /^(\d{3})(\d{1,3}).*/,
                        "$1.$2"
                    );
                }

                input.value = valor;
            });
        }

        aplicarMascaraCPF(document.getElementById("input_cpf"));
        aplicarMascaraCPF(campoCPFRecuperar);

        // VOLTAR PARA O INÍCIO
        document.getElementById("btn_voltar_inicio").onclick = (e) => {
            e.preventDefault();
            window.location.href = "index.html";
        };

        // IR PARA CADASTRO
        document.getElementById("btn_ir_cadastro").onclick = (e) => {
            e.preventDefault();
            window.location.href = "cadastroCandidato.html";
        };

        // LOGIN DO CANDIDATO
        document.getElementById("form_login").addEventListener("submit", async (e) => {
            e.preventDefault();

            const cpf = document.getElementById("input_cpf").value.replace(/\D/g, "");
            const senha = document.getElementById("input_senha").value;

            msgResultado.innerText = "";

            try {
                const resposta = await fetch("http://localhost:3000/loginUsuario", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ cpf, senha })
                });

                const data = await resposta.json();

                if (data.valido) {
                    // SALVAR LOGIN
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("id_usuario", data.id_usuario);

                    // REDIRECIONAMENTO APÓS LOGIN
                    const redirect = localStorage.getItem("redirect_pos_login");

                    if (redirect) {
                        localStorage.removeItem("redirect_pos_login");
                        window.location.href = redirect;
                    } else {
                        window.location.href = "perfil.html";
                    }

                } else {
                    msgResultado.innerText = "CPF ou senha inválidos";
                }

            } catch (erro) {
                console.error("Erro no login:", erro);
                msgResultado.innerText = "Erro no servidor";
            }
        });

        // ABRIR MODAL DE RECUPERAÇÃO
        document.getElementById("btnEsqueciSenha").onclick = (e) => {
            e.preventDefault();

            boxRecuperar.style.display = "flex";

            campoCPFRecuperar.value = "";
            campoNovaSenha.value = "";
            campoPIN.value = "";

            campoPIN.disabled = true;
            campoPIN.placeholder = "Digite o CPF primeiro";

            campoCPFRecuperar.focus();
        };

        // HABILITAR PIN APÓS DIGITAR O CPF
        campoCPFRecuperar.addEventListener("input", () => {
            const cpf = campoCPFRecuperar.value.replace(/\D/g, "");

            campoPIN.value = "";

            if (cpf.length === 11) {
                campoPIN.disabled = false;
                campoPIN.placeholder = "Digite seu PIN de segurança";
            } else {
                campoPIN.disabled = true;
                campoPIN.placeholder = "Digite o CPF completo primeiro";
            }
        });

        // FECHAR MODAL
        function fecharRecuperar() {
            boxRecuperar.style.display = "none";
        }

        // ATUALIZAR SENHA USANDO CPF E PIN
        botaoRecuperar.onclick = async () => {
            const cpf = campoCPFRecuperar.value.replace(/\D/g, "");
            const PIN = campoPIN.value.trim();
            const novaSenha = campoNovaSenha.value;

            if (cpf.length !== 11) {
                alert("Digite um CPF válido com 11 dígitos.");
                campoCPFRecuperar.focus();
                return;
            }

            if (!PIN || !novaSenha) {
                alert("Preencha o PIN e a nova senha.");
                return;
            }

            if (novaSenha.length < 6) {
                alert("A nova senha deve ter pelo menos 6 caracteres.");
                campoNovaSenha.focus();
                return;
            }

            botaoRecuperar.disabled = true;

            try {
                const resposta = await fetch("http://localhost:3000/recuperarSenha", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        cpf,
                        PIN,
                        novaSenha
                    })
                });

                const data = await resposta.json();

                if (resposta.ok && data.ok) {
                    alert("Senha atualizada com sucesso!");
                    fecharRecuperar();
                } else {
                    alert(data.erro || "Não foi possível atualizar a senha.");
                }

            } catch (erro) {
                console.error("Erro ao atualizar senha:", erro);
                alert("Erro ao comunicar com o servidor.");
            } finally {
                botaoRecuperar.disabled = false;
            }
        };
    </script>

</body>

</html>
