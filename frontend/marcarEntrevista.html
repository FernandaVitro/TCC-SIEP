<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Entrevista - TalentBridge</title>
    <link rel="stylesheet" href="Styles/marcarEntrevista.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">


</head>

<body>

    <div class="container">
        <button class="voltar" onclick="window.history.back()">
            <i class="fas fa-arrow-left"></i> Voltar para painel
        </button>
        <div class="card">
            <div class="header-box">
                <div class="icon-square"><i class="far fa-calendar-alt"></i></div>
                <h1>Agendar Entrevista</h1>
                <p>Selecione o candidato e defina os detalhes</p>
            </div>

            <form id="agendarForm">
                <div class="form-group">
                    <label>Candidato *</label>
                    <select id="select-candidato" required>
                        <option value="" disabled selected>
                            Selecione o candidato
                        </option>
                    </select>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Data *</label>
                        <input type="date" required>
                    </div>
                    <div class="form-group">
                        <label>Horário *</label>
                        <input type="time" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Tipo de Entrevista *</label>
                    <div class="type-selector">
                        <div class="type-option active" data-type="presencial">
                            <i class="fas fa-map-marker-alt"></i> Presencial
                        </div>
                        <div class="type-option" data-type="online">
                            <i class="fas fa-video"></i> Online
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label id="labelLocal">Local da Entrevista *</label>
                    <input type="text" id="inputLocal" placeholder="Endereço completo" required>
                </div>

                <button type="button" class="btn-submit">
                    Agendar Entrevista
                </button>

            </form>

        </div>

    </div>


    <script>

        const token = localStorage.getItem("token")
        const idCandidatura = localStorage.getItem("id_candidatura")
        const idEmpresa = localStorage.getItem("id_empresa")

        let tipoSelecionado = "presencial"

        // ================= CARREGAR CANDIDATOS =================
        async function carregarCandidatos() {

            try {

                const resposta = await fetch(
                    `http://localhost:3000/candidatosEmpresa/${idEmpresa}`,
                    {
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                )

                const candidatos = await resposta.json()

                const select = document.getElementById("select-candidato")

                select.innerHTML = `
                    <option value="" disabled>
                        Selecione o candidato
                    </option>
                `

                candidatos.forEach(c => {

                    const selected =
                        c.id_candidatura == idCandidatura
                            ? "selected"
                            : ""

                    select.innerHTML += `
                        <option value="${c.id_candidatura}" ${selected}>
                            ${c.nome_completo} - ${c.titulo_vaga}
                        </option>
                    `
                })

            } catch (erro) {

                console.log(erro)

                alert("Erro ao carregar candidatos")
            }
        }

        carregarCandidatos()

        // ================= TROCAR TIPO =================
        document.querySelectorAll('.type-option').forEach(btn => {

            btn.addEventListener('click', function () {

                document
                    .querySelectorAll('.type-option')
                    .forEach(b => b.classList.remove('active'))

                this.classList.add('active')

                tipoSelecionado = this.dataset.type

                const label = document.getElementById('labelLocal')
                const input = document.getElementById('inputLocal')

                if (tipoSelecionado === 'online') {

                    label.innerText = 'Link da Reunião *'
                    input.placeholder = 'https://meet.google.com/...'

                } else {

                    label.innerText = 'Local da Entrevista *'
                    input.placeholder = 'Endereço completo'
                }
            })
        })

        // ================= AGENDAR =================
        document.querySelector(".btn-submit").onclick = async () => {

            const idCandidaturaSelecionada =
                document.getElementById("select-candidato").value

            const data =
                document.querySelector('input[type="date"]').value

            const horario =
                document.querySelector('input[type="time"]').value

            const local =
                document.getElementById('inputLocal').value

            if (
                !idCandidaturaSelecionada ||
                !data ||
                !horario ||
                !local
            ) {
                alert("Preencha tudo")
                return
            }

            try {

                const res = await fetch(
                    "http://localhost:3000/entrevistas",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Bearer " + token
                        },
                        body: JSON.stringify({
                            id_candidatura: idCandidaturaSelecionada,
                            data,
                            horario,
                            tipo: tipoSelecionado,
                            local_link: local
                        })
                    }
                )

                const r = await res.json()

                if (r.ok) {

                    alert("Entrevista agendada!")

                    window.location.href = "painelEmpresa.html"

                } else {

                    alert(r.erro || "Erro ao agendar")
                }

            } catch (erro) {

                console.log(erro)

                alert("Erro no servidor")
            }
        }

    </script>

</body>

</html>
