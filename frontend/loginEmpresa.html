
<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIEP</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="Styles/loginEmpresa.css">

    <link rel="icon" href="img/favicon.ico">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
</head>

<body>

    <!-- RECUPERAR SENHA -->
    <div id="boxRecuperarEmpresa" class="overlay-recuperar" style="display: none;">

        <div class="recuperar-card">

            <h3>Recuperar senha</h3>
            <p class="recuperar-sub">Digite seus dados</p>

            <div class="input-group">
                <div class="input-wrapper">
                    <i class="fa-solid fa-building"></i>
                    <input type="text" id="cnpjRecuperar" placeholder="CNPJ">
                </div>
            </div>



            <div class="input-group active">
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="novaSenhaRecuperarEmpresa" placeholder="Nova senha">
                </div>
            </div>

            <!-- RESPOSTA DINÂMICA -->
            <div class="input-group">
                <div class="input-wrapper">
                    <i class="fa-solid fa-circle-question"></i>
                    <input type="text" id="respostaSegurancaEmpresa" placeholder="..." disabled>
                </div>
            </div>

            <button class="btn-submit" id="btnRecuperarEmpresa">Atualizar senha</button>
            <button class="btn-cancelar" onclick="fecharRecuperarEmpresa()">Cancelar</button>

        </div>

    </div>

    <div class="container">

        <a href="#" class="back-link" id="btn_voltar_inicio">
            <i class="fa-solid fa-arrow-left"></i> Voltar para início
        </a>

        <div class="card">

            <img src="img/logo.png" class="logo-quadrada">

            <h1>Área da Empresa</h1>
            <p class="subtitle">Acesse o painel de gestão</p>

            <form id="form_login_empresa">

                <div class="input-group">
                    <label>Email Corporativo</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="input_email_empresa">
                    </div>
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="input_senha_empresa">
                    </div>
                </div>

                <button type="submit" class="btn-submit">Entrar</button>

                <p style="margin-top:10px;">
                    <a href="#" id="btnEsqueciSenhaEmpresa">Esqueci minha senha</a>
                </p>
            </form>

            <p id="msg_resultado"></p>

            <p class="footer-text">
                Não tem uma conta? <a href="#" id="btn_ir_cadastro_empresa">Cadastre sua empresa</a>
            </p>

        </div>

    </div>

    <script>

        let perguntaAtualEmpresa = null

        // VOLTAR
        document.getElementById("btn_voltar_inicio").onclick = () => {
            window.location.href = 'index.html';
        };

        // CADASTRO
        document.getElementById("btn_ir_cadastro_empresa").onclick = () => {
            window.location.href = 'cadastroEmpresa.html';
        };

        // LOGIN
        document.getElementById("form_login_empresa").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("input_email_empresa").value;
            const senha = document.getElementById("input_senha_empresa").value;

            try {
                const resposta = await fetch("http://localhost:3000/loginEmpresa", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, senha })
                });

                const data = await resposta.json();

                if (data.ok) {
                    localStorage.setItem("token", data.token)
                    localStorage.setItem("id_empresa", data.id_empresa)
                    window.location.href = "painelEmpresa.html"
                } else {
                    msg_resultado.innerText = "Email ou senha inválidos";
                }

            } catch {
                msg_resultado.innerText = "Erro no servidor";
            }
        });

        // MODAL
        const boxRecuperarEmpresa = document.getElementById("boxRecuperarEmpresa")

        document.getElementById("btnEsqueciSenhaEmpresa").onclick = () => {
            boxRecuperarEmpresa.style.display = "flex"
        }

        function fecharRecuperarEmpresa() {
            boxRecuperarEmpresa.style.display = "none"
        }


        // 🔥 RESET se mudar CNPJ
        document.getElementById("cnpjRecuperar").addEventListener("input", () => {

            const inputResposta = document.getElementById("respostaSegurancaEmpresa")

            inputResposta.disabled = true
            inputResposta.placeholder = ""
            inputResposta.value = ""

            perguntaAtualEmpresa = null
        })

        // 🔥 BUSCAR PERGUNTA
        document.getElementById("cnpjRecuperar").addEventListener("blur", async () => {

            const cnpj = document.getElementById("cnpjRecuperar").value.replace(/\D/g, "")

            if (!cnpj) return

            try {

                const res = await fetch("http://localhost:3000/perguntaSegurancaEmpresa", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ cnpj })
                })

                const data = await res.json()

                const inputResposta = document.getElementById("respostaSegurancaEmpresa")

                if (data.pergunta) {

                    perguntaAtualEmpresa = data.campo

                    inputResposta.disabled = false
                    inputResposta.placeholder = data.pergunta
                    inputResposta.value = ""

                } else {
                    inputResposta.disabled = true
                    inputResposta.placeholder = ""
                    alert(data.erro)
                }

            } catch (err) {
                alert("Erro ao buscar pergunta")
            }
        })

        // 🔥 RECUPERAR
        document.getElementById("btnRecuperarEmpresa").onclick = async () => {

            const cnpj = document.getElementById("cnpjRecuperar").value.replace(/\D/g, "")
            const resposta = document.getElementById("respostaSegurancaEmpresa").value.trim()
            const novaSenha = document.getElementById("novaSenhaRecuperarEmpresa").value

            if (!cnpj || !resposta || !novaSenha || !perguntaAtualEmpresa) {
                alert("Preencha tudo")
                return
            }

            const res = await fetch("http://localhost:3000/recuperarSenhaEmpresa", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    cnpj,
                    resposta,
                    campo: perguntaAtualEmpresa,
                    novaSenha
                })
            })

            const data = await res.json()

            if (data.ok) {
                alert("Senha atualizada!")
                fecharRecuperarEmpresa()
            } else {
                alert(data.erro)
            }
        }

    </script>

</body>
</html>
